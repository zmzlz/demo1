<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="jquery-3.3.1\jquery-3.3.1.min.js"></script>
    <script src="bootstrap-5.1.3-dist\js\bootstrap.min.js"></script>
    <script src="bootstrap-5.1.3-dist/js/bootstrap.js"></script>
    <link rel="stylesheet" href="bootstrap-5.1.3-dist/css/bootstrap.min.css">
</head>

    <body>
        <!--bootstrap实现弹出模态框-->
        <button type="button" class="btn  btn-outline-secondary" data-bs-target="#myModal" data-bs-toggle="modal">
            注册
        </button>
                <!--fade 淡入淡出-->
        <div class="modal fade"  id="myModal" aria-labelledby="myModallabel" aria-hidden="true" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="myModallabel">注册</h5>
                </div>
                <form id="formData" class="form-horizontal">
                <div class="modal-body">
                    <div class="form-group">
                    <label class="control-label col-lg-2">用户名：</label>
                    <div class="col-lg-9">
                    <input type="text" value="" name="username" placeholder="username" class="form-control"></br>
                    </div>
                    </div>
                    <div class="form-group">
                    <label class="control-label col-lg-2">密码：</label>
                    <div class="col-lg-9">
                        <input type="text" placeholder="password" value="" name="password" class="form-control"></br>
                    </div>
                    </div>
                    <div class="form-group">
                        <label class="control-label col-lg-2">密码：</label>
                        <div class="col-lg-9">
                            <input type="text" placeholder="password" value="再次输入密码" name="password" class="form-control">
                        </div>
                        </div>
                </div>
                   
                <div class="modal-footer">
                    
                <button class="btn btn-default" type="button" data-bs-dismiss="modal">关闭</button>
                <button class="btn btn-success" type="button" data-bs-dismiss="modal"> 确认</button>
                  
                </div>
                </form>
            </div>
        </div>
        </div>
       
        </body>
        

</html>
